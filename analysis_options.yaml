# Static analysis configuration for the refactored BMI app.
# Follows the dart-run-static-analysis skill: a standard rule set,
# strict type checks, and a formatter width of 100.
#
# Run: flutter analyze   (or: dart analyze lib test)
# Fix mechanically: dart fix --dry-run, then dart fix --apply
# Format: dart format .

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    use_super_parameters: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true

formatter:
  page_width: 100
  trailing_commas: preserve
